name: Bug report
description: Report a card, model or entity matching issue
body:
  - type: input
    id: versions
    attributes:
      label: Home Assistant and card versions
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Product model and firmware
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      options:
        - Zigbee2MQTT
        - ZHA
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected behavior and actual result
    validations:
      required: true
  - type: textarea
    id: entities
    attributes:
      label: Relevant entity IDs, device classes, config and screenshots
      description: Remove credentials and private device identifiers before posting.
