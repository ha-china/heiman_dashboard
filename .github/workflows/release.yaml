name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify tag matches package version
        run: node --input-type=module -e 'import fs from "node:fs"; const {version}=JSON.parse(fs.readFileSync("package.json")); if (process.env.GITHUB_REF_NAME !== `v${version}`) process.exit(1);'
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: git diff --exit-code -- dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Publish release with installable card
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/heiman_dashboard.js --verify-tag --generate-notes
