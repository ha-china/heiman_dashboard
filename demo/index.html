<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEIMAN Dashboard · 本地预览</title>
    <style>
      :root {
        color-scheme: light;
        --primary-color: #5d7755;
        --primary-text-color: #2d372f;
        --secondary-text-color: #727c70;
        --divider-color: #dfe4d9;
        --card-background-color: #fff;
        --secondary-background-color: #eff2e9;
        --ha-card-border-radius: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f3ec;
        color: #2d372f;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
      }
      .shell {
        max-width: 1280px;
        margin: auto;
        padding: 0 44px 48px;
      }
      header {
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dde2d6;
      }
      .wordmark {
        letter-spacing: 3px;
        font-size: 20px;
        font-weight: 850;
      }
      .wordmark small {
        letter-spacing: 1px;
        font-size: 10px;
        font-weight: 500;
        padding-left: 14px;
        color: #7c8677;
      }
      .demo-label {
        font-size: 11px;
        color: #727e6b;
      }
      .intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        padding: 36px 0 28px;
        gap: 20px;
      }
      .eyebrow {
        font-size: 10px;
        letter-spacing: 2px;
        font-weight: 700;
        color: #72836a;
      }
      h1 {
        margin: 12px 0;
        font-size: 33px;
        font-weight: 550;
        letter-spacing: -1px;
      }
      .intro p {
        margin: 0;
        font-size: 13px;
        color: #727e6b;
      }
      .connected {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        font-size: 11px;
        color: #68805e;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: #6b8b5e;
        border-radius: 50%;
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 5px;
        padding: 4px;
        border: 1px solid #dce2d4;
        border-radius: 10px;
      }
      button,
      select {
        font: inherit;
        cursor: pointer;
      }
      .tabs button {
        border: 0;
        padding: 9px 16px;
        border-radius: 7px;
        background: transparent;
        color: #6a7963;
        font-size: 12px;
      }
      .tabs button[aria-pressed="true"] {
        background: #5d7755;
        color: #fff;
      }
      .tools {
        display: flex;
        gap: 8px;
      }
      .tools select,
      .tools button {
        border: 1px solid #d4ddcc;
        background: #fafbf6;
        border-radius: 8px;
        color: #4d6246;
        padding: 9px 12px;
        font-size: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
        align-items: start;
      }
      .editor-panel {
        margin-top: 28px;
        border: 1px solid #dce2d4;
        background: #fafbf6;
        padding: 24px;
        border-radius: 16px;
      }
      .editor-panel[hidden] {
        display: none;
      }
      .editor-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 36px;
        align-items: start;
      }
      .editor-layout heiman-device-card {
        position: sticky;
        top: 16px;
        height: auto;
      }
      h2 {
        margin: 0 0 20px;
        font-size: 20px;
        font-weight: 550;
      }
      .events {
        font-size: 12px;
        min-height: 24px;
        color: #6b7865;
        margin-top: 20px;
        overflow-wrap: anywhere;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-top: 28px;
        padding-top: 16px;
        border-top: 1px solid #dce2d4;
        font-size: 10px;
        color: #7a8573;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid #5d7755;
        outline-offset: 3px;
      }
      @media (max-width: 1000px) {
        .shell {
          padding: 0 22px 32px;
        }
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 620px) {
        .shell {
          padding: 0 16px 24px;
        }
        header {
          height: 68px;
        }
        .wordmark small {
          display: none;
        }
        .grid,
        .editor-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .intro {
          align-items: start;
          flex-direction: column;
          padding: 28px 0;
        }
        h1 {
          font-size: 28px;
        }
        .tabs {
          width: 100%;
        }
        .tabs button {
          flex: 1;
          padding: 8px;
        }
        .tools {
          width: 100%;
        }
        .tools select {
          flex: 1;
        }
        .editor-panel {
          padding: 16px;
        }
        footer {
          flex-wrap: wrap;
        }
      }
    </style>
    <script type="module" src="/dist/heiman_dashboard.js"></script>
    <script type="module" src="/demo/demo.js"></script>
  </head>
  <body>
    <div class="shell">
      <header>
        <div class="wordmark">HEIMAN <small>HOME ASSISTANT</small></div>
        <span class="demo-label">本地演示 · 模拟设备数据</span>
      </header>
      <div class="intro">
        <div>
          <div class="eyebrow">YOUR HOME, IN GOOD HANDS</div>
          <h1>家的每一处，安心可见。</h1>
          <p>安全防护、环境感知与日常控制，尽在一个面板。</p>
        </div>
        <div class="connected"><span class="dot"></span>Zigbee2MQTT + ZHA</div>
      </div>
      <div class="toolbar">
        <div class="tabs" aria-label="样式">
          <button data-style="home" aria-pressed="true">家居风格</button
          ><button data-style="fire" aria-pressed="false">消防风格</button
          ><button data-style="minimal" aria-pressed="false">简约风格</button>
        </div>
        <div class="tools">
          <select id="scenario" aria-label="演示场景">
            <option value="normal">日常运行</option>
            <option value="alarm">烟雾报警</option>
            <option value="offline">设备离线</option>
            <option value="battery">低电量</option></select
          ><button id="edit-toggle" aria-expanded="false">卡片编辑器</button>
        </div>
      </div>
      <main class="grid" id="cards"></main>
      <section class="editor-panel" id="editor-panel" hidden>
        <h2>添加 HEIMAN 卡片</h2>
        <div class="editor-layout">
          <heiman-device-card-editor id="editor"></heiman-device-card-editor
          ><heiman-device-card id="editor-preview"></heiman-device-card>
        </div>
      </section>
      <div class="events" id="events" role="status"></div>
      <footer>
        <span>HEIMAN DASHBOARD / 0.1.0</span
        ><span
          >支持家居、消防与简约三种风格 · 实际功能取决于设备提供的实体</span
        >
      </footer>
    </div>
  </body>
</html>
